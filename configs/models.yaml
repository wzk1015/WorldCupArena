    api_key_env: GOOGLE_API_KEY
    base_url_env: GOOGLE_BASE_URL
    base_url: https://generativelanguage.googleapis.com/v1beta
    price_per_mtok: { input: 1.05, output: 6.30 }
    tools: [google_search]
    settings_supported: [S2]
  - id: claude-opus-4-7-thinking-search
    display_name: Claude Opus 4.7 (Thinking + Search)
    provider: anthropic
    model: claude-opus-4-7-thinking
    official_model: claude-opus-4-7
    api_key_env: ANTHROPIC_API_KEY
    base_url_env: ANTHROPIC_DIRECT_BASE_URL
    base_url: https://api.anthropic.com
    price_per_mtok: { input: 3.70, output: 18.50 }
    tools: [web_search]
    settings_supported: [S2]
  - id: gpt-5.4-search
    display_name: GPT-5.4 (Search)
    provider: openrouter
    model: openai/gpt-5.4
    reasoning_effort: low
    reasoning_summary: auto
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_BASE_URL
    base_url: https://openrouter.ai/api/v1
    price_per_mtok: { input: 2.50, output: 15.00 }
    tools: [web_search]
    settings_supported: [S2]
    timeout_seconds: 180

