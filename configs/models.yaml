open_llm:
  # Routed through OpenRouter's OpenAI-compatible endpoint. The public `id` values
  # stay stable for dashboard continuity; `model` is the exact OpenRouter slug.
  - id: deepseek-r1
    display_name: DeepSeek V4 Pro
    provider: openrouter
    model: deepseek/deepseek-v4-pro
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_BASE_URL
    base_url: https://openrouter.ai/api/v1
    price_per_mtok: { input: 0.435, output: 0.870 }
    json_mode: false
    open_weight: true
    settings_supported: [S1]
    max_run_retries: 1
    timeout_seconds: 180
  - id: qwen3-max
    display_name: Qwen3.7 Max
    provider: openrouter
    model: qwen/qwen3.7-max
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_BASE_URL
    base_url: https://openrouter.ai/api/v1
    price_per_mtok: { input: 1.25, output: 3.75 }
    json_mode: false
    open_weight: false
    settings_supported: [S1]
    max_run_retries: 1
    timeout_seconds: 180
  - id: kimi-k2
    display_name: Kimi K2.6
    provider: openrouter
    model: moonshotai/kimi-k2.6
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_BASE_URL
    base_url: https://openrouter.ai/api/v1
    price_per_mtok: { input: 0.684, output: 3.42 }
    json_mode: true
    max_tokens: 12000
    extra_body: { reasoning: { effort: "none", exclude: true } }
    open_weight: true
    settings_supported: [S1]
    max_run_retries: 1
    timeout_seconds: 180
  - id: glm-4.5
    display_name: GLM-5.1
    provider: openrouter
    model: z-ai/glm-5.1
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_BASE_URL
    base_url: https://openrouter.ai/api/v1
    price_per_mtok: { input: 0.98, output: 3.08 }
    json_mode: false
    open_weight: true
    settings_supported: [S1]
    max_run_retries: 1
    timeout_seconds: 180
  - id: doubao-seed-1.6-thinking
    display_name: Doubao Seed 2.0 Lite
    provider: openrouter
    model: bytedance-seed/seed-2.0-lite
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_BASE_URL
    base_url: https://openrouter.ai/api/v1
    price_per_mtok: { input: 0.25, output: 2.00 }
    json_mode: true
    max_tokens: 12000
    extra_body: { reasoning: { effort: "none", exclude: true } }
    open_weight: false
    settings_supported: [S1]
    max_run_retries: 1
    timeout_seconds: 180
    # The default GPTPlus5 variant (doubao-seed-2-0-lite-260428) intermittently
    # returns 500. On failure, auto-retry the 260215 variant on the same proxy.
    # See build_runner_chain() in src/runners/__init__.py.
    fallbacks:
      - gptplus5_model: doubao-seed-2-0-lite-260215
  - id: minimax-m2.7
    display_name: MiniMax M2.7
    provider: openrouter
    model: minimax/minimax-m2.7
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_BASE_URL
    base_url: https://openrouter.ai/api/v1
    price_per_mtok: { input: 0.26, output: 1.20 }
    json_mode: true
    max_tokens: 20000
    extra_body: { reasoning: { effort: low, exclude: true } }
    open_weight: false
    settings_supported: [S1]
    max_run_retries: 1
    timeout_seconds: 180
