deep_research_agent:
  - id: yunwu-o4-mini-deep-research
    provider: openai_deep_research
    model: o4-mini-deep-research
    api_key_env: YUNWU_API_KEY
    base_url_env: YUNWU_BASE_URL
    base_url: https://api.yunwu.ai/v1
    price_per_mtok: { input: 2.00, output: 8.00 }
    price_per_tool_call: 0.010
    web_search_tool: web_search_preview
    settings_supported: [S2]
    max_tokens: 30000
    timeout_seconds: 300
    max_wait_seconds: 1800
    poll_seconds: 10
    json_compiler_max_tokens: 20000
    max_format_retries: 0
    max_run_retries: 1
  - id: gemini-deep-research
    provider: google_deep_research
    model: deep-research-pro-preview-12-2025
    agent: deep-research-pro-preview-12-2025
    api_key_env: GOOGLE_API_KEY
    base_url_env: GOOGLE_BASE_URL
    base_url: https://generativelanguage.googleapis.com/v1beta
    price_per_mtok: { input: 1.05, output: 6.30 }
    fallback_price_per_run_usd: 3.00
    settings_supported: [S2]
    max_wait_seconds: 1800
    poll_seconds: 10
    max_format_retries: 0
    max_run_retries: 1
