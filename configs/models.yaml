open_llm:
  # Routed through Yunwu's OpenAI-compatible endpoint. The exact upstream can be
  # changed per key / platform without touching runner code.
  - id: deepseek-r1
    provider: yunwu
    model: deepseek-r1
    api_key_env: YUNWU_API_KEY
    base_url_env: YUNWU_BASE_URL
    base_url: https://api.yunwu.ai/v1
    price_per_mtok: { input: 0.55, output: 2.19 }
    json_mode: false
    open_weight: true
    settings_supported: [S1]
    max_run_retries: 1
