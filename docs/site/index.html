<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>⚽ WorldCupArena — AI 足球预测排行榜</title>
<meta name="description" content="用真实足球比赛评测大模型和 Deep Research Agent 的预测能力，包含实时排行榜和即将进行比赛的模型预测。" />
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { fontFamily: { mono: ['Inter', 'system-ui', 'sans-serif'] } } } }</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { color-scheme: dark; }
  .font-mono { font-variant-numeric: tabular-nums; }
  body {
    font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background:
      radial-gradient(1000px 500px at 15% -5%, rgba(34,197,94,.07), transparent 60%),
      #0a0f1a;
    color: #d1d5db;
  }
  .glow { text-shadow: 0 0 32px rgba(34,197,94,.25); }
  .card {
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.09);
  }
  .pitch {
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 40px, rgba(255,255,255,.02) 40px 80px),
      linear-gradient(180deg, #0f2a18, #0a1e11);
    border: 1px solid rgba(34,197,94,.25);
  }
  .chip {
    display:inline-flex; align-items:center; gap:.35rem;
    padding:.15rem .55rem; border-radius:999px;
    font-size:.7rem; font-weight:600; letter-spacing:.02em;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
  }
  .chip-s1 { background: rgba(59,130,246,.18); border-color: rgba(59,130,246,.4); color:#93c5fd; }
  .chip-s2 { background: rgba(236,72,153,.18); border-color: rgba(236,72,153,.4); color:#f9a8d4; }
  /* Instant CSS tooltip — no JS, no delay */
  [data-tip] { position: relative; }
  [data-tip]::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: #1e2a3a; color: #e2e8f0; font-size: .7rem; font-weight: 400;
    line-height: 1.4; white-space: normal; width: 220px; max-width: 90vw;
    padding: .4rem .6rem; border-radius: .4rem;
    border: 1px solid rgba(255,255,255,.15);
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
    pointer-events: none; opacity: 0; transition: opacity .08s;
    z-index: 100;
  }
  [data-tip]:hover::after { opacity: 1; }
  .rank-medal { width:1.75rem; height:1.75rem; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; font-weight:800; }
  .rank-1 { background:linear-gradient(135deg,#facc15,#f59e0b); color:#1a1a1a; }
  .rank-2 { background:linear-gradient(135deg,#cbd5e1,#94a3b8); color:#1a1a1a; }
  .rank-3 { background:linear-gradient(135deg,#f97316,#b45309); color:#1a1a1a; }
  .animate-fade { animation: fade .6s ease-out both; }
  @keyframes fade { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform:none;} }
  .bar { height:10px; border-radius:6px; background:rgba(255,255,255,.08); overflow:hidden; }
  .bar-fill { height:100%; background: linear-gradient(90deg, #22c55e, #3b82f6); }
  details > summary { list-style:none; cursor:pointer; }
  details > summary::-webkit-details-marker { display:none; }
  .gradient-text {
    background: linear-gradient(90deg,#4ade80,#60a5fa);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tab-btn.active { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.28); }
  .pred-grid { align-items: start; }
  .pred-expanded { grid-column: 1 / -1; }
  .team-name { overflow-wrap: anywhere; }
  .lang-toggle { min-width: 4.75rem; justify-content:center; }
  @media (max-width: 767px) {
    body {
      background:
        radial-gradient(760px 360px at 20% -10%, rgba(34,197,94,.08), transparent 62%),
        #0a0f1a;
    }
    section { scroll-margin-top: 4.5rem; }
    .chip { padding: .22rem .6rem; }
    .pred-action { padding: .38rem .7rem; font-size: .74rem; }
    .pred-toggle {
      width: 100%;
      justify-content: center;
      padding: .68rem .9rem;
      border-radius: .75rem;
      font-size: .86rem;
      color: #bbf7d0;
      background: rgba(34,197,94,.18);
      border-color: rgba(34,197,94,.42);
      box-shadow: 0 8px 24px rgba(34,197,94,.08);
    }
    .pred-expanded {
      padding: .75rem;
      overflow-x: auto;
    }
    .leaderboard-table {
      table-layout: fixed;
      font-size: .72rem;
    }
    .leaderboard-table th,
    .leaderboard-table td {
      padding: .45rem .35rem;
    }
    .leaderboard-mobile-hide,
    .leaderboard-setting-badges {
      display: none !important;
    }
    .leaderboard-rank-cell {
      width: 2.1rem;
    }
    .leaderboard-score-cell {
      width: 5.6rem;
    }
    .leaderboard-model-row {
      min-width: 0;
      flex-wrap: nowrap;
    }
    .leaderboard-model-name {
      display: block;
      min-width: 0;
      max-width: calc(100vw - 9.7rem);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .leaderboard-score-bar {
      width: 3.2rem;
    }
    .rank-medal {
      width: 1.35rem;
      height: 1.35rem;
      font-size: .68rem;
    }
    .mobile-history-scoreboard {
      border-radius: .75rem;
      padding: .7rem;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 28px, rgba(255,255,255,.015) 28px 56px),
        linear-gradient(180deg, #0f2a18, #0a1e11);
      border: 1px solid rgba(34,197,94,.2);
    }
    [data-tip]::after { display: none; }
  }
</style>
</head>
