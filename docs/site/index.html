<script>
  (() => {
    const params = new URLSearchParams(window.location.search);
    const theme = params.get("theme") === "light" ? "light" : "dark";
    const matchmateParam = params.get("matchmate");
    const matchmatePath = window.location.pathname.replace(/\/+$/, "") === "/predict";
    const matchmate = matchmateParam === "1" || (matchmateParam !== "0" && matchmatePath);
    document.documentElement.dataset.theme = theme;
    document.documentElement.dataset.mode = matchmate ? "matchmate" : "worldcuparena";
    document.documentElement.style.colorScheme = theme;
    if (matchmate) document.title = "MatchMate AI比分预测";
  })();
</script>
