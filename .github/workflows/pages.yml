name: pages

# Publishes docs/site/ to GitHub Pages whenever main changes the site
# sources or the underlying data payload. Triggered by:
#   - the automate workflow committing updated data*.json
#   - any manual push touching docs/site/ or the site payload builders
#
# GH Pages setup: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/leaderboard/**"
      - "src/leaderboard/build_site.py"
      - "src/leaderboard/translate_site_data.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt python-dotenv pyyaml
      - name: Build bilingual site payload
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          SITE_TRANSLATION_MODEL: ${{ vars.SITE_TRANSLATION_MODEL }}
        run: python -m src.leaderboard.build_site
      - uses: actions/configure-pages@v5
      - name: Assemble site dir
        run: |
          mkdir -p _site
          cp -r docs/site/* _site/
          # Back-compat: also ship the old raw.json for anyone reading it.
          if [ -f docs/leaderboard/raw.json ]; then
            cp docs/leaderboard/raw.json _site/raw.json
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
